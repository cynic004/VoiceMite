name: Windows build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and non-interactive checks
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build all projects
        run: dotnet build VoiceMite.sln --configuration Release --nologo

      - name: Run core protocol and state checks
        run: dotnet run --project tests/VoiceMite.Tests/VoiceMite.Tests.csproj --configuration Release --no-build

      - name: Run STA isolation checks with a simulated target
        run: dotnet run --project tests/VoiceMite.WorkerTests/VoiceMite.WorkerTests.csproj --configuration Release --no-build -- --report artifacts/ci/worker-tests.json

      - name: Package unsigned portable and source archives
        run: ./tools/publish.ps1 -DotNetPath (Get-Command dotnet).Source -SkipInstaller

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VoiceMite-windows-${{ github.run_number }}
          path: |
            artifacts/VoiceMite-*-win-x64-portable.zip
            artifacts/VoiceMite-*-source.zip
            artifacts/SHA256SUMS.txt
            artifacts/ci/worker-tests.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
